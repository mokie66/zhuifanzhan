# --------------------------------------------------------------------------
# 通用流代理：兜底 http-only 的 m3u8 / ts（页面在 https 下的混合内容场景）
# 前端在 utils/media.js 里按需使用 /collect/_stream?url=<encoded>
# --------------------------------------------------------------------------
location = /collect/_stream {
    # 用 resolver 动态解析目标域名（不能用 proxy_pass 变量时的静态写法）
    resolver 223.5.5.5 119.29.29.29 valid=300s;
    resolver_timeout 5s;
    set $stream_url $arg_url;
    if ($stream_url = "") { return 400 "missing url param"; }
    proxy_pass $stream_url;
    proxy_http_version 1.1;
    proxy_set_header Host $proxy_host;
    proxy_set_header Connection "";
    proxy_ssl_server_name on;
    proxy_ssl_protocols TLSv1.2 TLSv1.3;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
    add_header Access-Control-Allow-Origin "*" always;
}

# 未配置的 key 直接 404，便于排查前端写错源标识
location /collect/ {
    return 404 '{"error":"unknown collect source"}';
    add_header Content-Type "application/json; charset=utf-8";
}
