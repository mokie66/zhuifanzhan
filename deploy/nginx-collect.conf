# ==========================================================================
# /collect 采集源反向代理配置（由 scripts/gen-nginx.mjs 自动生成，勿手改）
#
# 作用：把浏览器发往 /collect/<key> 的请求转发到真实采集源。
#
# 为什么必须代理：
#   1) 所有采集接口都不返回 Access-Control-Allow-Origin，浏览器直连被 CORS 拦
#   2) 部分源是 http，页面若在 https 下会被混合内容策略拦
#   3) 部分源校验 Referer，需要在服务端补上
#
# 注意：视频 CDN（m3u8/ts）已带 ACAO:*，无需代理，播放由前端 hls.js 直连。
# ==========================================================================

# 量子资源（启用，权重 100）
# 延迟最低（约 0.3s），线路含直链 m3u8，实测可播
location = /collect/lzi {
    # 保留原始查询串（ac/pg/t/wd 等），追加到上游采集路径后面
    proxy_pass http://cj.lziapi.com/api.php/provide/vod/$is_args$args;

    proxy_http_version 1.1;
    proxy_set_header Host cj.lziapi.com;
    proxy_set_header Connection "";
    # 部分采集源会校验 Referer，补成源站自身域名最稳妥
    proxy_set_header Referer http://cj.lziapi.com/;
    proxy_set_header User-Agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36";

    # 采集源普遍较慢，超时给足；并发限制避免打爆上游
    proxy_connect_timeout 10s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;

    # 采集结果不缓存，保证看到最新资源
    proxy_buffering on;
    proxy_buffers 8 32k;
}

# 兼容带路径的调用形式：/collect/lzi/...
location /collect/lzi/ {
    proxy_pass http://cj.lziapi.com/api.php/provide/vod/;
    proxy_http_version 1.1;
    proxy_set_header Host cj.lziapi.com;
    proxy_set_header Referer http://cj.lziapi.com/;
    proxy_read_timeout 30s;
}

